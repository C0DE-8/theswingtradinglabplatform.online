<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Swing Trading Lab Platform - Account Setup</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../assets/js/api.js"></script>

  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #05060b;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(800px 420px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(720px 420px at 82% 16%, rgba(34,197,94,.12), transparent 62%),
        linear-gradient(180deg, #05060b 0%, #080914 100%);
    }
    .panel {
      width: min(560px, 100%);
      background: rgba(12,12,18,.72);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      backdrop-filter: blur(16px);
    }
    .pill {
      border: 1px solid rgba(251,191,36,.28);
      background: rgba(251,191,36,.10);
      color: rgb(253 230 138);
    }
    .btn-primary { background: linear-gradient(90deg, rgba(56,189,248,.95), rgba(34,197,94,.86)); }
    .btn-soft { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel rounded-3xl p-6 sm:p-8">
      <div class="flex items-start justify-between gap-4">
        <div>
          <div class="text-2xl font-black leading-tight">Account setting up</div>
          <div class="mt-1 text-sm text-white/55" id="emailLine">Checking account status...</div>
        </div>
        <span class="pill rounded-2xl px-3 py-2 text-xs font-black whitespace-nowrap" id="statusPill">PENDING</span>
      </div>

      <div class="mt-6 rounded-3xl btn-soft p-5">
        <div class="text-lg font-black">Waiting for admin confirmation</div>
        <p class="mt-2 text-sm leading-relaxed text-white/65">
          Your account has been created and is under review. Once an admin approves it, dashboard access will open automatically the next time this page checks your account.
        </p>
      </div>

      <div id="alert" class="hidden mt-5 rounded-2xl px-4 py-3 text-sm border"></div>

      <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <button id="btnRefresh" type="button" class="btn-primary rounded-2xl py-3 font-black">Check Status</button>
        <button id="btnLogout" type="button" class="btn-soft rounded-2xl py-3 font-black">Logout</button>
      </div>

      <div class="mt-6 text-xs text-white/45">
        2018 - <span id="yr"></span> The Swing Trading Lab Platform
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.SwayApi.userBase;
    const TOKEN_KEY = "swing_trading_lab_platform_token";
    const USER_KEY = "swing_trading_lab_platform_user";

    document.getElementById("yr").textContent = new Date().getFullYear();

    const emailLine = document.getElementById("emailLine");
    const statusPill = document.getElementById("statusPill");
    const alertBox = document.getElementById("alert");
    const btnRefresh = document.getElementById("btnRefresh");

    function getStorage() {
      return localStorage.getItem(TOKEN_KEY) ? localStorage : sessionStorage;
    }
    function getToken() {
      return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || "";
    }
    function showAlert(type, msg) {
      alertBox.classList.remove("hidden");
      alertBox.textContent = msg;
      alertBox.className = "mt-5 rounded-2xl px-4 py-3 text-sm border " + (
        type === "success"
          ? "bg-emerald-500/10 border-emerald-400/20 text-emerald-200"
          : type === "warn"
            ? "bg-amber-500/10 border-amber-400/20 text-amber-200"
            : "bg-red-500/10 border-red-400/20 text-red-200"
      );
    }
    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      sessionStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(USER_KEY);
      sessionStorage.removeItem(USER_KEY);
      window.location.href = "../auth/login.html";
    }
    function renderPending(user) {
      const label = user?.email || user?.username || "Account pending approval";
      emailLine.textContent = label;
      statusPill.textContent = "PENDING";
    }
    async function checkStatus(showSuccess) {
      const token = getToken();
      if (!token) {
        window.location.href = "../auth/login.html";
        return;
      }

      btnRefresh.disabled = true;
      btnRefresh.textContent = "Checking...";
      try {
        const res = await axios.get(`${API_BASE}/me`, {
          headers: { Authorization: `Bearer ${token}` },
          timeout: 20000,
        });
        const user = res.data?.user || {};
        getStorage().setItem(USER_KEY, JSON.stringify(user));

        if (Number(user.is_verified) === 1) {
          statusPill.textContent = "APPROVED";
          showAlert("success", "Account approved. Redirecting to dashboard...");
          setTimeout(() => window.location.href = "../pages/dashboard.html", 700);
          return;
        }

        renderPending(user);
        if (showSuccess) showAlert("warn", "Still pending admin approval.");
      } catch (err) {
        const status = err?.response?.status;
        if (status === 401 || status === 403) {
          logout();
          return;
        }
        showAlert("error", err?.response?.data?.message || "Could not check account status.");
      } finally {
        btnRefresh.disabled = false;
        btnRefresh.textContent = "Check Status";
      }
    }

    document.getElementById("btnRefresh").addEventListener("click", () => checkStatus(true));
    document.getElementById("btnLogout").addEventListener("click", logout);
    checkStatus(false);
    setInterval(() => checkStatus(false), 30000);
  </script>
</body>
</html>
