<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>The Swing Trading Lab Platform - Account Approval</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #05060b;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    .shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(800px 420px at 18% 0%, rgba(56,189,248,.18), transparent 60%),
        linear-gradient(180deg, #05060b 0%, #080914 100%);
    }
    .panel {
      width: min(520px, 100%);
      background: rgba(12,12,18,.72);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
      backdrop-filter: blur(16px);
    }
    .btn-primary { background: linear-gradient(90deg, rgba(56,189,248,.95), rgba(34,197,94,.86)); }
    .btn-soft { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel rounded-3xl p-6 sm:p-8">
      <div class="text-2xl font-black">Admin approval required</div>
      <p class="mt-3 text-sm leading-relaxed text-white/65">
        Email code verification has been removed. New accounts are reviewed by an admin before dashboard access is enabled.
      </p>
      <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <a href="../pages/setting-up.html" class="btn-primary rounded-2xl py-3 font-black text-center">View Setup Status</a>
        <a href="../auth/login.html" class="btn-soft rounded-2xl py-3 font-black text-center">Back to Login</a>
      </div>
    </section>
  </main>
</body>
</html>
